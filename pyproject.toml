[project]
name = "mercado-livre-sales-analytics"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.154.0",
    "uvicorn==0.54.0",
    "pandas==3.0.6",
    "numpy==2.5.4",
    "pydantic==2.14.1",
    "python-multipart==0.0.32",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
